<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 330" width="910" height="330" role="img" aria-label="Circles become Access policies: a card in the Friends circle gets an Access application that lets in ana@example.com; a card in Everyone opens with no login">
<title>Circles become Access policies: a card in the Friends circle gets an Access application that lets in ana@example.com; a card in Everyone opens with no login</title>
<style>
  text { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 15px; fill: #19191b; }
  .t { font-weight: 800; font-size: 16px; }
  .s { font-size: 13px; fill: #6b6b70; }
  .m { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; fill: #6b6b70; }
  .box { fill: #fff; stroke: #19191b; stroke-width: 2; }
  .shadow { fill: #19191b; }
  .frame { fill: #f4f4f2; stroke: #19191b; stroke-width: 2; stroke-dasharray: 6 5; }
  .yellow { fill: #ffd23f; } .green { fill: #6ee7a0; } .pink { fill: #ff9fb2; } .blue { fill: #5cc8ff; } .lilac { fill: #ececea; }
  .line { stroke: #19191b; stroke-width: 2.5; fill: none; }
  .dash { stroke-dasharray: 7 5; }
  .head { fill: #19191b; }
  .on-color { fill: #19191b; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0 0 L10 5 L0 10 z" />
  </marker>
</defs>

<circle class="lilac" cx="190" cy="170" r="140" style="stroke:#6c5ce7;stroke-width:3;fill-opacity:.9"/>
<circle cx="330" cy="200" r="120" style="fill:#6ee7a0;fill-opacity:.35;stroke:#1a9e2a;stroke-width:3"/>
<text class="t" x="95" y="62">Friends</text>
<text class="m" x="95" y="82">ana@example.com</text>
<text class="t" x="365" y="112">Everyone</text>
<rect class="shadow" x="154" y="154" width="120" height="50" rx="4"/>
<rect class="box box" x="150" y="150" width="120" height="50" rx="4" style="stroke-width:2"/>
<text class="t" x="162" y="174">brew</text>
<rect class="shadow" x="254" y="234" width="120" height="50" rx="4"/>
<rect class="box box" x="250" y="230" width="120" height="50" rx="4" style="stroke-width:2"/>
<text class="t" x="262" y="254">tick3d</text>
<polyline class="line" points="476,175 556,175" marker-end="url(#arrow)"/>
<rect class="shadow" x="574" y="64" width="320" height="100" rx="4"/>
<rect class="box yellow" x="570" y="60" width="320" height="100" rx="4" style="stroke-width:2"/>
<text class="t on-color" x="582" y="84">brew.example.com</text>
<text class="s on-color" x="582" y="104">Access application</text>
<text class="s on-color" x="582" y="122">policy “Friends”: allow ana@example.com</text>
<rect class="shadow" x="574" y="204" width="320" height="100" rx="4"/>
<rect class="box green" x="570" y="200" width="320" height="100" rx="4" style="stroke-width:2"/>
<text class="t on-color" x="582" y="224">tick3d.example.com</text>
<text class="s on-color" x="582" y="244">no login: a Bypass policy</text>
<text class="s on-color" x="582" y="262">for the Everyone circle</text>
</svg>
