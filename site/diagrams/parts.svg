<rect class="box box" x="270" y="160" width="340" height="88" rx="4" style="stroke-width:2"/>
<text class="t" x="282" y="184">kitshn Worker + Durable Object</text>
<text class="s" x="282" y="204">the map, shares, deploys, the queue</text>
