<text class="s" x="32" y="214">browsers, phones,</text>
<text class="s" x="32" y="232">service tokens</text>
<rect class="frame" x="240" y="20" width="400" height="420" rx="6"/><text class="t" x="254" y="46">Cloudflare</text>
<rect class="shadow" x="274" y="64" width="340" height="70" rx="4"/>
