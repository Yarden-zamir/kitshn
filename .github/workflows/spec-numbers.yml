name: spec numbers

# A PR that adds a K- number to docs/ fails when main or another open PR already defines it with other text.
on:
  pull_request:
    paths: [docs/**, scripts/next-k.ts, .github/workflows/spec-numbers.yml]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR head with full history, so the script finds where the branch left main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: K- numbers are free
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! gh pr list --limit 1 >/dev/null 2>&1; then
            echo "::warning::gh cannot read the open PRs, so the K- number check did not run."
            exit 0
          fi
          node scripts/next-k.ts --check
