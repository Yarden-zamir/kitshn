name: kitshn 2 deploy

# The reusable deploy workflow of kitshn 2 (K-803, K-810). An app repo calls it with:
#
#   on:
#     push:
#     pull_request:
#       types: [opened, synchronize, reopened, closed]
#     workflow_dispatch:
#   permissions:
#     contents: read
#     id-token: write
#   jobs:
#     kitshn:
#       uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
#       secrets: inherit
#
# A static site with its own build job passes `artifact` and `artifact-path` (K-805). Use that pattern for a build
# that runs untrusted code: its job has no `id-token: write`, so it cannot ask for the token that deploys. The closing of a pull request
# builds nothing but must still remove its preview, so the caller uses this pattern:
#
#   jobs:
#     build:
#       if: github.event.action != 'closed'
#       permissions:
#         contents: read
#       steps: [... build, then actions/upload-artifact with the name of `artifact` ...]
#     kitshn:
#       needs: build
#       if: ${{ !cancelled() && !failure() }}
#       uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
#       with: { artifact: site, artifact-path: dist }
#       secrets: inherit
#
# A repo with several apps (`defineApps`, K-804) passes the artifacts by app key in `artifacts`, a JSON text:
#
#       with:
#         artifacts: '{"cv": {"name": "cv", "path": "cv/public"}}'
#
# A Compose app gets each KITSHN_<NAME> secret and variable as <NAME> (K-808), from the GitHub Environment
# "prod" for the default branch and "pr-<number>" for pull requests, as in KitSHn 1; other branches get no
# Environment, so only repo secrets. A Worker app gets them as secret bindings. A GitHub value wins over a value of
# the kitshn store (K-831); kitshn gets only the names here, and the CLI sends the values only where they go.
# A repo secret also reaches the previews of pull requests; a secret for production only goes in the Environment "prod".
#
# It reads kitshn.config.ts without running it, and sends it with the GitHub OIDC token (K-811).
on:
  workflow_call:
    inputs:
      server:
        description: The kitshn address.
        type: string
        default: https://kit.yarden-zamir.com
      artifact:
        description: >-
          A static site that an earlier job of the same run built (K-805): the name of its artifact. kitshn puts it
          at artifact-path, the output folder of the recipe, and the recipe then names no build.
        type: string
        default: ""
      artifact-path:
        description: Where the artifact goes, the output folder of the recipe. Needed with artifact.
        type: string
        default: ""
      artifacts:
        description: >-
          Several apps (K-804): the artifact of each app by key, as JSON {"<app>": {"name": "<artifact>", "path":
          "<output folder>"}}. `artifact` and `artifact-path` stay for the app `app`.
        type: string
        default: ""

jobs:
  deploy:
    # A pull request from a fork gets no OIDC token, so kitshn cannot deploy it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # K-807: prod only for the default branch (the full ref, so a tag named like it does not count); any other push or
    # dispatch deploys with no GitHub Environment, and kitshn skips a branch that the recipe does not deploy.
    environment: >-
      ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'prod' || '' }}
    # One deploy at a time per pull request and per branch; kitshn binds each push environment to one branch.
    concurrency:
      group: kitshn-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
    steps:
      # The source of a Compose app goes to the machine with .git, so the checkout keeps no token in it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A closed pull request only removes its preview, so its build job did not run (see the header).
      - if: inputs.artifact != '' && github.event.action != 'closed'
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          case "$ARTIFACT_PATH" in
            "" | . | ./ | /* | ..*)
              echo "kitshn: artifact-path must be the output folder of the recipe inside the repo, not '$ARTIFACT_PATH'."
              exit 1
              ;;
          esac
      - if: inputs.artifact != '' && github.event.action != 'closed'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifact-path }}
      # K-804: every artifact of the run, each in a folder with its name; the CLI moves each into its app.
      - if: inputs.artifacts != '' && github.event.action != 'closed'
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/kitshn-artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Only KITSHN_* names leave this step, in a file; the build commands of the next step see no secrets.
      - name: kitshn params
        env:
          SECRETS: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
        run: |
          umask 077
          node -e '
            const pick = (text) => Object.fromEntries(Object.entries(JSON.parse(text || "{}")).filter(([key]) => key.startsWith("KITSHN_")));
            require("fs").writeFileSync(process.argv[1], JSON.stringify({ secrets: pick(process.env.SECRETS), vars: pick(process.env.VARS) }));
          ' "$RUNNER_TEMP/kitshn-params.json"
      # K-618: the repo copy of the kitshn skill follows the release. An old or missing copy warns; the deploy goes on.
      - name: kitshn skill
        if: github.event.action != 'closed'
        env:
          SERVER: ${{ inputs.server }}
        run: |
          version=$(curl -fsSL --max-time 20 "$SERVER/deploy/version" || true)
          copy=.claude/skills/kitshn/SKILL.md
          if [ ! -f "$copy" ]; then
            echo "::warning::This repo has no copy of the kitshn skill. Add it with: kitshn skill install --repo"
          elif [ -n "$version" ]; then
            named=$(sed -n 's/^<!-- kitshn edge-\([^.]*\)\..*/\1/p' "$copy" | head -n 1)
            if [ "$named" != "$version" ]; then
              echo "::warning::$copy is edge-${named:-unknown}, not edge-$version (the release of kitshn). Update it with: kitshn skill install --repo"
            fi
          fi
      # K-617: the CLI of the release that the kitshn server names, checked against its SHA256SUMS. The download goes
      # through the GitHub API: the releases/download addresses answered 504 for hours on 2026-11-08. The token stays in
      # this step, so the build commands of the next step do not see it.
      - name: kitshn CLI
        env:
          SERVER: ${{ inputs.server }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(curl -fsSL "$SERVER/deploy/version")
          [[ "$version" =~ ^[0-9a-f]{12}$ ]] || { echo "kitshn: $SERVER names no release ($version)."; exit 1; }
          cd "$RUNNER_TEMP"
          gh release download "edge-$version" -R Yarden-zamir/kitshn -p kitshn.mjs -p SHA256SUMS --clobber
          grep ' kitshn.mjs$' SHA256SUMS | sha256sum -c -
      - name: kitshn deploy
        env:
          SERVER: ${{ inputs.server }}
          KITSHN_PARAMS_JSON: ${{ runner.temp }}/kitshn-params.json
          KITSHN_ARTIFACT_PATH: ${{ inputs.artifact != '' && inputs.artifact-path || '' }}
          KITSHN_ARTIFACTS: ${{ github.event.action != 'closed' && inputs.artifacts || '' }}
          KITSHN_ARTIFACT_DIR: ${{ runner.temp }}/kitshn-artifacts
        run: node "$RUNNER_TEMP/kitshn.mjs" deploy --server "$SERVER"
